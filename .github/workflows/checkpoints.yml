name: Checkpoints

on:
  push:
    paths:
      - "exercises_with_checks/**"
  workflow_dispatch:

jobs:
  checkpoints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - week: week01
            tests: test_week01_knn.py
          - week: week02
            tests: test_week02.py
          - week: week03
            tests: test_week03.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest nbformat nbclient ipykernel scikit-learn pandas numpy matplotlib seaborn xgboost

      - name: Run checkpoint ${{ matrix.week }}
        run: pytest exercises_with_checks/checks/${{ matrix.tests }} -v --tb=short
